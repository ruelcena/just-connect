[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "just-connect"
version = "0.2.0"
description = "A minimal Python VNC desktop client with optional TinyVNC backend."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "you@example.com"}
]
keywords = ["vnc", "remote-desktop", "qt", "pyside6"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "PySide6>=6.5",
    "vncdotool>=0.12.0",
    "Pillow>=10.0",
    "keyring>=25.0",
    "pyautogui>=0.9",
    "mss>=10.0",
]

[project.optional-dependencies]
tinyvnc = [
    "pybind11>=2.12",
]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.2",
]

[project.scripts]
just-connect = "just_connect.app:main"
just-connect-cli = "just_connect.cli:main"
just-connect-server = "just_connect.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
